name: Python CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - "dev"
    paths:
      - "backend/**"

jobs:
  ruff:
    name: Run ruff on changed python files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed python files
        id: changed-python-files
        run: >
          echo "files=$(
            git diff --name-only --diff-filter=ACMRT
            ${{ github.event.pull_request.base.sha }}
            ${{ github.sha }}
            | grep -E "\.(py|pyi)$"
            | xargs
          )" >> $GITHUB_OUTPUT

      - name: Run ruff
        if: steps.changed-python-files.outputs.files != ''
        uses: astral-sh/ruff-action@v3
        with:
          src: ${{ steps.changed-python-files.outputs.files }}
          args: "--no-fix"
